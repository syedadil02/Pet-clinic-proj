apiVersion: v1
kind: Service
metadata:
  name: admin-server
  namespace: spring-petclinic
  labels:
    app: admin-server
    app.kubernetes.io/name: admin-server
    app.kubernetes.io/part-of: petclinic
spec:
  type: ClusterIP
  selector:
    app: admin-server
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: 9090
