apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: spring-petclinic
  labels:
    app: config-server
    app.kubernetes.io/name: config-server
    app.kubernetes.io/part-of: petclinic
spec:
  type: ClusterIP
  selector:
    app: config-server
  ports:
    - name: http
      protocol: TCP
      port: 8888
      targetPort: 8888
